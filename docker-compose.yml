services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       nascon_db
      POSTGRES_USER:     nascon
      POSTGRES_PASSWORD: nascon_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Redis 7 ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── NaSCon '26 Backend API ───────────────────────────────────────────────────
  api:
    build: ./backend
    image: nascon-26-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV:      production
      PORT:          8080
      DATABASE_URL:  postgresql://nascon:nascon_pass@postgres:5432/nascon_db
      REDIS_URL:     redis://redis:6379
      JWT_SECRET:    ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: 2h
      DAY1_SALT:     ${DAY1_SALT}   # Never hard-coded — injected from host env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
