name: nascon_26
description: NaSCon '26 multi-sport league operations platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0

  # Secure storage (Keystore / Keychain)
  flutter_secure_storage: ^9.2.2

  # Offline local DB
  hive_flutter: ^1.1.0

  # Connectivity detection
  connectivity_plus: ^6.1.0

  # UUID generation
  uuid: ^4.5.1

  # Shared prefs (non-sensitive only: server URL)
  shared_preferences: ^2.3.2

  # PDF opening
  open_filex: ^4.5.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
