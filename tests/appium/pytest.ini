[pytest]
# Run with: pytest tests/appium/ -v --junitxml=tests/reports/appium-report.xml
addopts = -v --tb=short
# Markers used by the suite
markers =
    readiness: service readiness probes
    deeplink: adb deep-link launch tests
    appium: tests that require a live Appium driver session
    cross_surface: tests that combine Appium + Selenium
