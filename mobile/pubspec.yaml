name: nascon_26
description: NaSCon '26 multi-sport league operations platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Secure storage — works on Android/iOS; web falls back to localStorage
  flutter_secure_storage: ^9.2.2

  # Local DB — works on all platforms including web
  hive_flutter: ^1.1.0

  # Connectivity detection
  connectivity_plus: ^6.1.0

  # UUID generation
  uuid: ^4.5.1

  # HTTP client
  dio: ^5.7.0

  # Shared prefs — works on all platforms
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
